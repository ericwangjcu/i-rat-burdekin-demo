name: Import full standalone i-RAT build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-build.yml'

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download successful private build artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-54a8-81fa-a043-3af1111c1dce/raw?se=2026-08-23T20%3A36%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=64346219-3c13-5367-8ee1-8ae0998b830c&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T02%3A20%3A25Z&ske=2026-08-24T02%3A20%3A25Z&sks=b&skv=2026-02-06&sig=qC8hB2RZp7y1hDDqBFywivE6hEpLE0m/FgiQL/XoRTM%3D' -o /tmp/irat-build.zip
          unzip -o /tmp/irat-build.zip -d .

      - name: Remove source maps and one-time importer
        run: |
          find static -type f -name '*.map' -delete || true
          rm -f static/js/*.LICENSE.txt || true
          git rm .github/workflows/import-full-build.yml

      - name: Commit compiled site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy full standalone Burdekin i-RAT frontend'
          git push
