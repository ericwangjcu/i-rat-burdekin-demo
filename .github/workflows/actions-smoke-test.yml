name: Public Actions smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-smoke-test.yml'
permissions:
  contents: read
jobs:
  test-scenario-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Test exact default scenario CSVs
        shell: bash
        run: |
          set -u
          urls=(
            "https://incentiv8.s3.ap-southeast-2.amazonaws.com/Public/V6/Burdekin/AyrDPI/Mulg/15AprV1R4/T1/999/Furrow/LowFreq/200/BareFallow/3b6823fcfce6f81cf9f52f11d52afb5dd530cfa82c95a266619bae8402e52fbf.csv"
            "https://incentiv8.s3.ap-southeast-2.amazonaws.com/Public/V6/Burdekin/AyrDPI/Mulg/15AprV1R4/T1/999/Furrow/LowFreq/200/BareFallow/4d8ba6c736a5292e91081a776c4fa66aac6773efaf07f95d7159808d4eed5974.csv"
            "https://incentiv8.s3.ap-southeast-2.amazonaws.com/Public/V8/Mackay/Mackay/Pind/MW_01MayR6V1/MW_T3/3/Furrow/SWD_0_50_200_50_50/130_150/MW_Surf2/BareFallow/6e92e8a24344c5ec6e5defb966b7c750520d7c07fb2f68dbe0cad6914aec16d6.csv"
            "https://incentiv8.s3.ap-southeast-2.amazonaws.com/Public/V8/Mackay/Mackay/Pind/MW_01MayR6V1/MW_T3/3/LPOH_5_15/SWD_0_50_200_50_50/130_150/MW_Surf2/BareFallow/0084d9c1d5e419b41aab73b1959c877399be948781ca49cb58d2141f85e139d2.csv"
          )
          for url in "${urls[@]}"; do
            echo "==== $url"
            curl -sS -D /tmp/headers -o /tmp/body -w 'HTTP=%{http_code} SIZE=%{size_download}\n' "$url" || true
            grep -Ei '^(HTTP/|access-control-allow-origin:|content-type:|content-length:|x-amz-error-code:)' /tmp/headers || true
            head -c 120 /tmp/body || true
            echo
          done
