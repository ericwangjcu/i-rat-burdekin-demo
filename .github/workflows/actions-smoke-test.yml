name: Public Actions smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-smoke-test.yml'
permissions:
  contents: read
jobs:
  verify-mackay:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Mackay live in a real browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1600')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL','performance':'ALL'})
          d=webdriver.Chrome(options=opts)
          try:
              d.get('https://ericwangjcu.github.io/i-rat-burdekin-demo/?mackayverify=20260829h')
              time.sleep(8)
              for b in d.find_elements(By.TAG_NAME,'button'):
                  if b.is_displayed() and b.text.strip().lower()=='accept':
                      d.execute_script('arguments[0].click();',b); time.sleep(1); break
              for b in d.find_elements(By.TAG_NAME,'button'):
                  if b.is_displayed() and 'paddock settings' in b.text.lower():
                      d.execute_script('arguments[0].click();',b); break
              time.sleep(2)

              target=None
              for m in d.find_elements(By.CSS_SELECTOR,'.leaflet-marker-icon'):
                  if 'Pleystowe Sugar Mill' in (m.get_attribute('outerHTML') or ''):
                      target=m
              if target is None:
                  raise SystemExit('No Pleystowe marker found')
              d.execute_script('arguments[0].click();',target)
              time.sleep(3)

              applied=False
              for b in d.find_elements(By.TAG_NAME,'button'):
                  if b.is_displayed() and b.text.strip().lower()=='apply':
                      d.execute_script('arguments[0].click();',b)
                      applied=True
                      break
              if not applied:
                  raise SystemExit('Apply button not found')
              time.sleep(18)

              final=d.find_element(By.TAG_NAME,'body').text
              print('HAS ERROR', 'Failed to get scenario data' in final)
              print('SUMMARY', [x for x in final.splitlines() if 'Summary of changes' in x][:3])

              req={}; events=[]
              for entry in d.get_log('performance'):
                  try:
                      msg=json.loads(entry['message'])['message']; method=msg.get('method'); p=msg.get('params',{})
                      if method=='Network.requestWillBeSent':
                          rid=p.get('requestId'); url=p.get('request',{}).get('url',''); req[rid]=url
                          if '/V8/' in url or 'Mackay' in url: events.append(('REQUEST','',url))
                      elif method=='Network.responseReceived':
                          r=p.get('response',{}); url=r.get('url','')
                          if '/V8/' in url or 'Mackay' in url: events.append(('RESPONSE',str(r.get('status'))+' '+str(r.get('mimeType')),url))
                      elif method=='Network.loadingFailed':
                          url=req.get(p.get('requestId'),'')
                          if '/V8/' in url or 'Mackay' in url: events.append(('FAILED',str(p),url))
                  except Exception: pass
              for e in events: print(*e)

              if 'Failed to get scenario data' in final:
                  raise SystemExit('Mackay still shows scenario error')
              if 'Summary of changes (averaged across 50 seasons' not in final:
                  raise SystemExit('Mackay did not load 50 seasons')
              bad=[e for e in events if e[0]=='RESPONSE' and not e[1].startswith('200 ')]
              if bad:
                  raise SystemExit('Mackay has non-200 scenario responses: '+repr(bad))
              print('MACKAY_LIVE_BROWSER_OK')
          finally:
              d.quit()
          PY
