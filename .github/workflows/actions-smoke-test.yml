name: Public Actions smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-smoke-test.yml'
permissions:
  contents: read
jobs:
  reproduce-mackay:
    runs-on: ubuntu-latest
    steps:
      - name: Switch live paddock to Mackay and trace requests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1600')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL','performance':'ALL'})
          d=webdriver.Chrome(options=opts)
          try:
              d.get('https://ericwangjcu.github.io/i-rat-burdekin-demo/?mackaytrace=20260829f')
              time.sleep(8)
              for b in d.find_elements(By.TAG_NAME,'button'):
                  if b.is_displayed() and b.text.strip().lower()=='accept':
                      d.execute_script('arguments[0].click();',b); time.sleep(1); break

              for b in d.find_elements(By.TAG_NAME,'button'):
                  if b.is_displayed() and 'paddock settings' in b.text.lower():
                      d.execute_script('arguments[0].click();',b); break
              time.sleep(2)

              markers=d.find_elements(By.CSS_SELECTOR,'.leaflet-marker-icon')
              print('MARKER COUNT',len(markers))
              for i,m in enumerate(markers):
                  try:
                      print('MARKER',i,'title=',repr(m.get_attribute('title')),'alt=',repr(m.get_attribute('alt')),'src=',repr(m.get_attribute('src')),'outer=',m.get_attribute('outerHTML')[:1200])
                  except Exception as e: print('MARKER ERR',i,e)

              # Region station markers are ordered Ayr, Bundaberg, Pleystowe in this standalone build.
              # Click the Pleystowe/Mackay marker, preferring any element with a matching title/alt.
              target=None
              for m in markers:
                  txt=' '.join(filter(None,[m.get_attribute('title'),m.get_attribute('alt'),m.get_attribute('aria-label')])).lower()
                  if 'pleystowe' in txt or 'mackay' in txt:
                      target=m; break
              if target is None and len(markers)>=3:
                  target=markers[-1]
              if target is None:
                  raise SystemExit('No Mackay/Pleystowe marker found')
              print('CLICKING TARGET',target.get_attribute('outerHTML')[:1200])
              d.execute_script('arguments[0].scrollIntoView({block:"center"});',target)
              d.execute_script('arguments[0].click();',target)
              time.sleep(4)
              body=d.find_element(By.TAG_NAME,'body').text
              print('AFTER MARKER REGION LINES', [line for line in body.splitlines() if line.startswith('Region ') or 'Pleystowe' in line or 'Mackay' in line][:30])
              print('AFTER MARKER BODY START')
              print(body[-7000:])
              print('AFTER MARKER BODY END')

              # Close applies changed paddock settings in this UI.
              closed=False
              for b in d.find_elements(By.TAG_NAME,'button'):
                  if b.is_displayed() and b.text.strip().lower()=='close':
                      print('CLICK CLOSE')
                      d.execute_script('arguments[0].click();',b)
                      closed=True
                      break
              print('CLOSED',closed)
              time.sleep(18)

              final=d.find_element(By.TAG_NAME,'body').text
              print('FINAL BODY START')
              print(final[:9000])
              print('FINAL BODY END')
              print('HAS ERROR', 'Failed to get scenario data' in final)
              print('LOCALSTORAGE',d.execute_script('return JSON.stringify(localStorage);'))

              req={}; events=[]
              for entry in d.get_log('performance'):
                  try:
                      msg=json.loads(entry['message'])['message']; method=msg.get('method'); p=msg.get('params',{})
                      if method=='Network.requestWillBeSent':
                          rid=p.get('requestId'); url=p.get('request',{}).get('url',''); req[rid]=url
                          if any(k in url for k in ('.csv','/data/','amazonaws','/V8/','Mackay')): events.append(('REQUEST','',url))
                      elif method=='Network.responseReceived':
                          r=p.get('response',{}); url=r.get('url','')
                          if any(k in url for k in ('.csv','/data/','amazonaws','/V8/','Mackay')): events.append(('RESPONSE',str(r.get('status'))+' '+str(r.get('mimeType')),url))
                      elif method=='Network.loadingFailed':
                          url=req.get(p.get('requestId'),'')
                          if any(k in url for k in ('.csv','/data/','amazonaws','/V8/','Mackay')): events.append(('FAILED',str(p),url))
                  except Exception: pass
              print('--- NETWORK ---')
              for e in events: print(*e)
              print('--- BROWSER ---')
              for e in d.get_log('browser'): print(e)
          finally:
              d.quit()
          PY
