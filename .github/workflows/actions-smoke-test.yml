name: Public Actions smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-smoke-test.yml'
permissions:
  contents: read
jobs:
  inspect-regional-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect compiled regional and storage contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('static/js/main.threeregion-20260829.js')
          s=p.read_text(encoding='utf-8')
          needles=[
            'irat-standalone-paddocks',
            'Burdekin demo',
            'Mackay',
            'Bundaberg',
            'root:"V6"',
            'root:"V8"',
            'root:"BMRGDemoV1"',
            'MW_01MayR6V1',
            'weatherStations:[Sk.Mackay]',
          ]
          for needle in needles:
              print('\n===== NEEDLE',needle,'COUNT',s.count(needle),'=====')
              start=0
              for n in range(min(10,s.count(needle))):
                  i=s.find(needle,start)
                  if i<0: break
                  print(f'--- occurrence {n+1} at {i} ---')
                  print(s[max(0,i-1200):min(len(s),i+len(needle)+1800)])
                  start=i+len(needle)
          PY
