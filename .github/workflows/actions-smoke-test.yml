name: Public Actions smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-smoke-test.yml'
permissions:
  contents: read
jobs:
  inspect-s3-contexts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print compiled S3 URL contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/js/main.threeregion-20260829.js')
          s=p.read_text(encoding='utf-8')
          needle='https://incentiv8.s3.ap-southeast-2.amazonaws.com/Public'
          pos=[]; start=0
          while True:
              i=s.find(needle,start)
              if i<0: break
              pos.append(i); start=i+1
          print('COUNT',len(pos))
          for n,i in enumerate(pos,1):
              print(f'--- OCCURRENCE {n} at {i} ---')
              print(s[max(0,i-500):min(len(s),i+len(needle)+500)])
          PY
