<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Tariff Assessment Tool V6</title></head><body><p style="font-family:system-ui;padding:24px">Loading Energy Tariff Assessment Tool V6…</p><script>(async()=>{let s='';for(let i=1;i<=7;i++)s+=await (await fetch('part'+i+'.txt')).text();const b=atob(s.trim());const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();
// Fix V6 usage preview/example-data bug.
txt=txt.replaceAll('allRows(a)','rowsFor(a.id)');
// Redraw usage preview after Step 2 becomes visible.
txt=txt.replace("if(id==='change')loadMonitoringForm();window.scrollTo(0,0)}","if(id==='change')loadMonitoringForm();if(id==='imports')setTimeout(()=>{syncUsageSelectors();renderUsagePreview()},30);window.scrollTo(0,0)}");
// Make non-money bar-chart tooltips show numeric values.
txt=txt.replace("<title>${escSvg(lab)} · ${escSvg(ser.name)}: ${escSvg(money(v))}</title>","<title>${escSvg(lab)} · ${escSvg(ser.name)}: ${escSvg(opt.money===false?num(v,1):money(v))}</title>");
// Add Step 3 visual rate comparisons once.
if(!txt.includes('tariffEnergyRateChart')){const marker='<div class="grid three" id="tariffCards"></div>';const charts=`<div class="grid two" style="margin-top:14px"><div class="card"><div class="chart-titleline"><h3>Energy usage rates</h3><span>c/kWh</span></div><div id="tariffEnergyRateChart" class="chartbox"></div><div class="chart-note">Flat tariffs show one usage rate. Time-of-use tariffs show Peak, Shoulder and Off-peak rates separately.</div></div><div class="card"><div class="chart-titleline"><h3>Daily supply charges</h3><span>c/day</span></div><div id="tariffSupplyChart" class="chartbox"></div><div class="chart-note">These fixed daily charges apply regardless of monthly energy use. T24C also has a separate demand charge shown in its editable card.</div></div></div>`;txt=txt.replace(marker,marker+charts);}
if(!txt.includes('function renderTariffCharts(){')){const fn=`function renderTariffCharts(){let cats=Object.keys(tariffs);drawBarChart('tariffEnergyRateChart',cats,[{name:'Flat',values:cats.map(k=>tariffs[k].flat!=null?tariffs[k].flat*100:null),color:'#0d7666'},{name:'Peak',values:cats.map(k=>tariffs[k].peak!=null?tariffs[k].peak*100:null),color:'#b85b52'},{name:'Shoulder',values:cats.map(k=>tariffs[k].shoulder!=null?tariffs[k].shoulder*100:null),color:'#718f88'},{name:'Off-peak',values:cats.map(k=>tariffs[k].offpeak!=null?tariffs[k].offpeak*100:null),color:'#4c78a8'}],{aria:'Energy usage rates by tariff',money:false});drawBarChart('tariffSupplyChart',cats,[{name:'Supply charge',values:cats.map(k=>Number(tariffs[k].supply||0)*100),color:'#0d7666'}],{aria:'Daily supply charges by tariff',money:false});}\n`;txt=txt.replace('function renderTariffs(){',fn+'function renderTariffs(){');txt=txt.replace("$('offpeakHours').value=A.hoursWeek.offpeak\n}","$('offpeakHours').value=A.hoursWeek.offpeak;renderTariffCharts()\n}");}
document.open();document.write(txt);document.close();})();</script></body></html>
